              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  if (intent.action == "PLANNER_DONE") {
                      val id = intent.getStringExtra("task_id") ?: return
                      val prefs = context.getSharedPreferences("planner_native", Context.MODE_PRIVATE)
                      val pending = JSONArray(prefs.getString("pending", "[]") ?: "[]")
                      pending.put(id)
                      prefs.edit().putString("pending", pending.toString()).apply()
                      val manager = AppWidgetManager.getInstance(context)
                      val ids = manager.getAppWidgetIds(ComponentName(context, TaskWidgetProvider::class.java))
                      manager.notifyAppWidgetViewDataChanged(ids, R.id.widget_list)
                  }
              }
          }
          ''', encoding='utf-8')

          (package_dir / 'TaskWidgetService.kt').write_text(r'''package com.planner.planner_app

          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import android.widget.RemoteViewsService
          import org.json.JSONArray

          class TaskWidgetService : RemoteViewsService() {
              override fun onGetViewFactory(intent: Intent): RemoteViewsFactory = Factory(applicationContext)
              class Factory(private val context: Context) : RemoteViewsFactory {
                  private var tasks = JSONArray()
                  private fun load() {
                      tasks = JSONArray(context.getSharedPreferences("planner_native", Context.MODE_PRIVATE).getString("tasks", "[]") ?: "[]")
                  }
                  override fun onCreate() = load()
                  override fun onDataSetChanged() = load()
                  override fun onDestroy() {}
                  override fun getCount() = tasks.length()
                  override fun getViewAt(position: Int): RemoteViews {
                      val task = tasks.getJSONObject(position)
                      val row = RemoteViews(context.packageName, R.layout.planner_widget_item)
                      row.setTextViewText(R.id.widget_task_title, task.optString("title"))
                      row.setTextViewText(R.id.widget_task_time, task.optString("time"))
                      row.setOnClickFillInIntent(R.id.widget_task_row, Intent().putExtra("task_id", task.optString("id")))
                      return row
                  }
                  override fun getLoadingView(): RemoteViews? = null
                  override fun getViewTypeCount() = 1
                  override fun getItemId(position: Int) = position.toLong()
                  override fun hasStableIds() = false
              }
          }
          ''', encoding='utf-8')

          res = root / 'android/app/src/main/res'
          (res / 'layout').mkdir(parents=True, exist_ok=True)
          (res / 'drawable').mkdir(parents=True, exist_ok=True)
          (res / 'xml').mkdir(parents=True, exist_ok=True)
