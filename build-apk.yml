name: Build Planner APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These GitHub Secrets are not set:$missing  (see README.md, section 2)"
            exit 1
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Generate launcher icons from icon.png
        continue-on-error: true
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          src = Image.open('icon.png').convert('RGBA')
          for d, s in (('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)):
              p = 'app/src/main/res/mipmap-' + d
              os.makedirs(p, exist_ok=True)
              im = src.resize((s, s), Image.LANCZOS)
              im.save(p + '/ic_launcher.png')
              m = Image.new('L', (s * 4, s * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, s * 4 - 1, s * 4 - 1), fill=255)
              m = m.resize((s, s), Image.LANCZOS)
              r = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              r.paste(im, (0, 0), m)
              r.save(p + '/ic_launcher_round.png')
          PY

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/planner.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/planner.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee sign.txt
          echo "### Planner 1.0.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Certificate (must be identical in every build):" >> "$GITHUB_STEP_SUMMARY"
          grep "SHA-256" sign.txt >> "$GITHUB_STEP_SUMMARY" || true
          cp "$APK" "Planner-1.0.${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Planner-apk
          path: Planner-1.0.${{ github.run_number }}.apk
