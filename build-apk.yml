              <TextView android:id="@+id/widget_title" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="کارهای پلنر" android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold" />
              <TextView android:id="@+id/widget_add" android:layout_width="36dp" android:layout_height="36dp" android:gravity="center" android:text="+" android:textColor="#FFFFFF" android:textSize="24sp" android:background="@drawable/planner_widget_add" />
            </LinearLayout>
            <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1">
              <ListView android:id="@+id/widget_list" android:layout_width="match_parent" android:layout_height="match_parent" android:divider="#33445566" android:dividerHeight="1dp" />
              <TextView android:id="@+id/widget_empty" android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center" android:text="کاری برای نمایش نیست" android:textColor="#AAB4C8" />
            </FrameLayout>
          </LinearLayout>''', encoding='utf-8')
          (res / 'layout/planner_widget_item.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/widget_task_row" android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center_vertical" android:orientation="horizontal" android:paddingVertical="8dp">
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="○" android:textColor="#65B5FF" android:textSize="22sp" />
            <TextView android:id="@+id/widget_task_title" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="10dp" android:maxLines="1" android:ellipsize="end" android:textColor="#FFFFFF" android:textSize="14sp" />
            <TextView android:id="@+id/widget_task_time" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="8dp" android:textColor="#AAB4C8" android:textSize="12sp" />
          </LinearLayout>''', encoding='utf-8')
          (res / 'drawable/planner_widget_bg.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#E6141C28"/><corners android:radius="22dp"/></shape>''', encoding='utf-8')
          (res / 'drawable/planner_widget_add.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#4AA3F0"/></shape>''', encoding='utf-8')
          (res / 'xml/planner_widget_info.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="240dp" android:minHeight="160dp" android:updatePeriodMillis="0" android:initialLayout="@layout/planner_widget" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen" />''', encoding='utf-8')

          manifest = root / 'android/app/src/main/AndroidManifest.xml'
          m = manifest.read_text(encoding='utf-8')
          permissions = '''\n    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'''
          m = m.replace('<application', permissions + '\n    <application', 1)
          receivers = '''
                  <receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" android:exported="false" />
                  <receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver" android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
                  <receiver android:name=".TaskWidgetProvider" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/planner_widget_info" />
                  </receiver>
                  <service android:name=".TaskWidgetService" android:permission="android.permission.BIND_REMOTEVIEWS" android:exported="false" />
          '''
          m = m.replace('</application>', receivers + '\n</application>', 1)
          m = re.sub(r'android:label="[^"]*"', 'android:label="پلنر"', m, count=1)
          manifest.write_text(m, encoding='utf-8')
          PY

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
