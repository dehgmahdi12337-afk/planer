.note-tools .panel{display:none;flex-direction:column;gap:6px;padding:6px;border-radius:14px;background:var(--card);box-shadow:var(--sh)}
.note-tools.open .panel{display:flex}
.note-tools .panel button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--in);color:var(--tx)}
.note-tools .panel button:active,.note-tools .panel button.on{background:var(--ac);color:#111}
.note-tools .epal{display:none;flex-direction:column;gap:6px;padding:4px}
.note-tools .epal.show{display:flex}
.note-tools .epal i{width:22px;height:22px;border-radius:50%;border:2px solid transparent;display:block}
.note-tools .epal i.on{border-color:var(--tx)}
.note-editor-body{min-height:62vh;padding:14px 14px 14px 52px;border-radius:16px;background:var(--in);color:#111!important;line-height:1.95;outline:0;overflow-wrap:anywhere}
.note-editor-body:empty:before{content:attr(data-placeholder);color:var(--mut)}
.notes-head .in{font-size:13px;padding:10px 12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
