name: Build Planner APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, planner-kotlin-rebuild]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            test -s "$RUNNER_TEMP/upload-keystore.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Release signing is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are incomplete; building a DEBUG test APK instead of a release APK."
          fi

      - name: Create Flutter project
        run: flutter create --org ir.dehgmahdi --project-name planner --platforms=android app

      - name: Add Flutter packages
        working-directory: app
        run: |
          flutter pub add webview_flutter flutter_local_notifications:^17.2.4 timezone file_picker:11.0.3 path_provider
          flutter pub add --dev flutter_launcher_icons

      - name: Prepare app files and launcher icon
        run: |
          mkdir -p app/assets
          cp planner.html app/assets/planner.html
          cp main.dart app/lib/main.dart
          python3 -m pip install --quiet cairosvg
          cairosvg assets/app_icon.svg --output app/assets/app_icon.png

      - name: Configure Android app
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_READY: ${{ steps.signing.outputs.ready }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pubspec = Path("pubspec.yaml")
          text = pubspec.read_text(encoding="utf-8")
          text = text.replace(
              "uses-material-design: true",
              "uses-material-design: true\n  assets:\n    - assets/planner.html",
              1,
          )
          text += """
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/app_icon.png
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: assets/app_icon.png
          """
          pubspec.write_text(text, encoding="utf-8")

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Expected Android Kotlin Gradle file was not generated.")
          g = gradle.read_text(encoding="utf-8")
          g = g.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          g = re.sub(r'applicationId = "[^"]+"', 'applicationId = "ir.dehgmahdi.planner"', g, count=1)
          g = re.sub(r"minSdk = flutter.minSdkVersion", "minSdk = 23", g, count=1)
          g = re.sub(r"targetSdk = flutter.targetSdkVersion", "targetSdk = 36", g, count=1)
          import os
          if os.environ.get("SIGNING_READY") == "true":
              if "signingConfigs {" not in g:
                  g = g.replace(
                      "    buildTypes {",
                      """    signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {""",
                      1,
                  )
              g = re.sub(
                  r'getByName\("release"\)\s*\{[^}]*\}',
                  'getByName("release") { signingConfig = signingConfigs.getByName("release") }',
                  g,
                  count=1,
              )
              g = g.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
              )
          g = g.replace(
              "compileOptions {",
              "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
              1,
          )
          if "coreLibraryDesugaring(" not in g:
              g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          gradle.write_text(g, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text(encoding="utf-8")
          required_permissions = [
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.SCHEDULE_EXACT_ALARM",
          ]
          for permission in required_permissions:
              if f'android:name="{permission}"' not in m:
                  m = m.replace(
                      "<application",
                      f'    <uses-permission android:name="{permission}" />\\n    <application',
                      1,
                  )
          receivers = """
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
          """
          if "ScheduledNotificationReceiver" not in m:
              m = m.replace("</application>", receivers + "\n</application>", 1)
          m = re.sub(r'android:label="[^"]*"', 'android:label="پلنر"', m, count=1)
          manifest.write_text(m, encoding="utf-8")
          PY
          dart run flutter_launcher_icons
          flutter pub get

      - name: Install native Android widget integration
        working-directory: app
        run: |
          PKG_DIR="android/app/src/main/kotlin/ir/dehgmahdi/planner"
          mkdir -p "$PKG_DIR" android/app/src/main/res/layout android/app/src/main/res/xml
          cp ../android-native/MainActivity.kt "$PKG_DIR/MainActivity.kt"
          cp ../android-native/PlannerWidgetProvider.kt "$PKG_DIR/PlannerWidgetProvider.kt"
          cp ../android-native/planner_widget.xml android/app/src/main/res/layout/planner_widget.xml
          cp ../android-native/planner_widget_info.xml android/app/src/main/res/xml/planner_widget_info.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          m = p.read_text(encoding="utf-8")
          receiver = """
                  <receiver
                      android:name="ir.dehgmahdi.planner.PlannerWidgetProvider"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider"
                          android:resource="@xml/planner_widget_info" />
                  </receiver>
                  <receiver
                      android:name="ir.dehgmahdi.planner.PlannerWidgetActionReceiver"
                      android:exported="false" />
          """
          if "PlannerWidgetProvider" not in m:
              m = m.replace("</application>", receiver + "\n</application>", 1)
          p.write_text(m, encoding="utf-8")
          PY

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build unsigned-identity debug test APK
        if: steps.signing.outputs.ready != 'true'
        working-directory: app
        run: flutter build apk --debug

      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: planner-apk-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload debug test APK
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: planner-apk-debug-test
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
