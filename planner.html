<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>پلنر من</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1c1f2a;--mut:#7a8095;--ac:#4f6df5;--ok:#22a06b;--ln:#e6e8f0;--bar:#dfe4fb;--bad:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13151c;--card:#1d2029;--tx:#eceef5;--mut:#9aa0b5;--ac:#7b92ff;--ok:#3ccb8c;--ln:#2b2f3c;--bar:#2e3555}}
:root[data-theme="dark"]{--bg:#13151c;--card:#1d2029;--tx:#eceef5;--mut:#9aa0b5;--ac:#7b92ff;--ok:#3ccb8c;--ln:#2b2f3c;--bar:#2e3555}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;max-width:560px;margin-inline:auto;padding:14px 14px 96px}
h1{font-size:21px;margin:0}h2{font-size:14px;color:var(--mut);margin:16px 0 8px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--ln);margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{flex:1;min-width:90px;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
textarea{width:100%;min-height:90px;direction:ltr;font-size:11px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--mut);padding:6px 8px}button.s{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.chips button{white-space:nowrap;padding:6px 12px;background:var(--card);color:var(--tx);border:1px solid var(--ln)}.chips button.on{background:var(--ac);color:#fff}
.t{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--ln)}.t:last-child{border:0}
.t input{flex:none;min-width:0;width:22px;height:22px;accent-color:var(--ok)}.t .n{flex:1}.t.d .n b{text-decoration:line-through;color:var(--mut)}
.t small{display:block;color:var(--mut);font-size:12px;margin-top:2px}.pb{width:4px;height:34px;border-radius:3px;flex:none}.od{color:var(--bad);text-decoration:none}
.empty{color:var(--mut);text-align:center;padding:14px 0}.note{font-size:12px;color:var(--mut);line-height:1.8}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kp div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}.kp b{font-size:20px;display:block}.kp span{font-size:11px;color:var(--mut)}
.hb{height:9px;border-radius:5px;background:var(--bar);overflow:hidden;margin:4px 0 10px}.hb i{display:block;height:100%}
nav{position:fixed;inset-inline:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:12px}nav button.on{color:var(--ac);font-weight:700}
#toast{position:fixed;inset-inline:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;padding:12px;border-radius:14px;display:none;z-index:6}
#toast button{background:rgba(255,255,255,.22);margin:8px 6px 0 0;padding:7px 12px}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
</style>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#3390ec;--ok:#2fb344;--bg:#e9eff9;--ln:rgba(110,130,160,.2);--glass:rgba(255,255,255,.55);--sheet:rgba(255,255,255,.88);--gb:rgba(255,255,255,.7);--sh:0 8px 28px rgba(50,80,130,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--ac:#4aa3f0;--ok:#4cd964;--bg:#0b121b;--ln:rgba(255,255,255,.08);--glass:rgba(26,38,54,.52);--sheet:rgba(22,32,46,.92);--gb:rgba(255,255,255,.09);--sh:0 8px 28px rgba(0,0,0,.4)}}
:root[data-theme='dark']{--ac:#4aa3f0;--ok:#4cd964;--bg:#0b121b;--ln:rgba(255,255,255,.08);--glass:rgba(26,38,54,.52);--sheet:rgba(22,32,46,.92);--gb:rgba(255,255,255,.09);--sh:0 8px 28px rgba(0,0,0,.4)}
body{padding-bottom:140px}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 90% 5%,rgba(51,144,236,.5),transparent 70%),radial-gradient(55% 40% at 0% 45%,rgba(150,90,240,.35),transparent 70%),radial-gradient(60% 40% at 85% 100%,rgba(30,200,170,.32),transparent 70%)}
h1{font-size:23px;font-weight:700}
button{border-radius:14px;font-weight:600}
input,select,textarea{background:rgba(125,140,165,.14);border-radius:14px;border:1px solid var(--ln)}
.card,.kp div{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid var(--gb);box-shadow:var(--sh);border-radius:22px}
.kp div{border-radius:18px}
#q{border-radius:16px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:12px 14px;border:1px solid var(--gb)}
.chips button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mut);padding:8px 12px}
.chips button.on{background:none;color:var(--ac);border-bottom-color:var(--ac)}
.t{gap:12px;padding:10px 2px}.t:active{background:rgba(125,140,165,.12)}
.av{position:relative;flex:none;width:50px;height:50px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:23px;box-shadow:0 4px 12px rgba(0,0,0,.18);cursor:pointer}
.av::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.4),transparent 60%);pointer-events:none}
.t .av input{position:absolute;inset:0;width:100%;height:100%;min-width:0;margin:0;opacity:0;z-index:2;cursor:pointer}
.av span,.av b{pointer-events:none}
.av b{display:none;position:absolute;inset:0;border-radius:50%;background:var(--ok);color:#fff;place-items:center;font-size:24px;z-index:1}
.av input:checked~b{display:grid}.av input:disabled~span{filter:grayscale(1);opacity:.45}
.t .n{min-width:0}.t .n b{font-size:15.5px;display:block;overflow:hidden;text-overflow:ellipsis}
.mt{display:flex;flex-direction:column;align-items:flex-end;gap:7px;font-size:12px;color:var(--mut);min-width:46px;direction:ltr}.mt i{width:9px;height:9px;border-radius:50%}
nav{inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin-inline:auto;padding:5px;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border:1px solid var(--gb);box-shadow:var(--sh)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;line-height:1.2;padding:8px 4px;border-radius:22px}nav button em{font-style:normal;font-size:19px}
nav button.on{background:rgba(51,144,236,.16);color:var(--ac)}
#plus{position:fixed;inset-inline-end:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;padding:0;font-size:30px;line-height:1;background:linear-gradient(135deg,#4db2ff,#2a7de1);box-shadow:0 10px 24px rgba(42,125,225,.45);z-index:5}
#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--sheet);color:var(--tx);border:1px solid var(--gb);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:var(--sh)}
#toast button{background:var(--ac);color:#fff}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.card.sheet{width:100%;max-width:560px;margin:0;border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;background:var(--sheet);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--mut);opacity:.4;margin:0 auto 12px}
#f-t{font-size:17px;padding:13px}
.ic{vertical-align:-2px;flex:none}nav button{padding:13px 4px}.chips button{padding:8px 14px}
#tip{display:none!important}
nav button{transition:flex .25s}
nav button.open{flex:2.6;flex-direction:row;gap:7px;color:var(--ac)}
nav button.open::after{content:attr(data-tip);font-size:12.5px;font-weight:700;white-space:nowrap}
.chips button{display:inline-flex;align-items:center}
.chips button.open::after{content:attr(data-tip);margin-inline-start:6px;font-size:12.5px;font-weight:700}
#plus,#th{display:flex;align-items:center;justify-content:center;transition:all .25s}
#plus.open{width:auto;padding:0 22px;gap:8px;border-radius:30px}
#plus.open::after{content:attr(data-tip);font-size:15px;white-space:nowrap}
#th.open{width:auto;padding:0 14px;gap:6px}
#th.open::after{content:attr(data-tip);font-size:12px;white-space:nowrap}
.cl{display:none;align-items:center;gap:4px;font-weight:700;margin-inline-end:8px}
.t.open .cl{display:inline-flex}
:root{color-scheme:light dark}:root[data-theme='dark']{color-scheme:dark}:root[data-theme='light']{color-scheme:light}
option{background:var(--card);color:var(--tx)}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.8}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px var(--card) inset;-webkit-text-fill-color:var(--tx);caret-color:var(--tx)}
#q{background-size:15px 15px;background-position:right 15px center;padding-right:40px}
.fld{flex:1;min-width:90px;display:flex;flex-direction:column;gap:5px}
.fl{font-size:12px;font-weight:600;color:var(--mut)}
.st{margin:0 0 12px;font-size:17px;font-weight:700;text-align:center}button svg{display:block}
.av{color:#fff;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#th{width:42px;height:42px;padding:0;display:grid;place-items:center}
#plus{display:grid;place-items:center}
h1{display:flex;align-items:center;gap:8px}h1 svg{color:var(--ac)}
#q{padding-right:44px;background-repeat:no-repeat;background-position:right 14px center;background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%238b95a8%22 stroke-width=%222%22 stroke-linecap=%22round%22%3E%3Ccircle cx=%2211%22 cy=%2211%22 r=%227%22/%3E%3Cpath d=%22M21 21l-4.3-4.3%22/%3E%3C/svg%3E')}
#tip{position:fixed;z-index:60;display:none;background:var(--sheet);color:var(--tx);border:1px solid var(--gb);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--sh);padding:6px 11px;border-radius:12px;font-size:12px;pointer-events:none;white-space:nowrap}

html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{overscroll-behavior:none}
</style>
<body>
<div class="top"><h1>📋 پلنر من</h1><div class="row"><button class="s" id="th">🌓</button></div></div>
<button id="plus" aria-label="کار جدید">＋</button>
<div id="fb"></div>
<input id="q" placeholder="🔍 جستجو در کارها…" style="width:100%;flex:none">
<div class="chips" id="chips"></div>
<div id="view"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const KEY='planner-v2';
let S={tasks:[],theme:''},U={tab:'today',cat:'',q:'',rng:7,form:false,edit:null,tm:null};
const CATS={'کار':'#4f6df5','شخصی':'#e0709a','مطالعه':'#e0a030','سلامت':'#22a06b','خرید':'#8a5cf5','سایر':'#7a8095'};
const PRI=['کم','متوسط','زیاد'],PC=['#7a8095','#e0a030','#e5484d'];
const z=n=>String(n).padStart(2,'0'),$=i=>document.getElementById(i);
const ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const TD=()=>ymd(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const fs=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const fm=m=>m<60?fs(m)+' دقیقه':fs(Math.floor(m/60))+' ساعت'+(m%60?' و '+fs(m%60)+' دقیقه':'');
const fd=s=>{try{return new Date(s+'T12:00:00').toLocaleDateString('fa-IR',{weekday:'short',month:'long',day:'numeric'})}catch(e){return s}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function setAt(t){t.at=t.time?new Date(t.date+'T'+t.time).getTime()-(t.rem||0)*60000:0;t.fired=false}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('planner-v1'));if(Array.isArray(o))S.tasks=o;else if(o&&o.tasks)S=Object.assign(S,o)}catch(e){}
 S.tasks.forEach(t=>{t.pri=t.pri||0;t.cat=t.cat||'سایر';t.rep=t.rep||'n';t.rem=t.rem||0;if(t.at===undefined){const n=t.notified;setAt(t);t.fired=!!n}});theme()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function theme(){const r=document.documentElement;S.theme?r.setAttribute('data-theme',S.theme):r.removeAttribute('data-theme')}
function quick(s){s=s.replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));let d=null,t='';
 const m=s.match(/(\d{1,2})[:٫](\d{2})/);if(m&&+m[1]<24&&+m[2]<60){t=z(+m[1])+':'+m[2];s=s.replace(m[0],' ')}
 if(/پس.?فردا/.test(s)){d=addD(TD(),2);s=s.replace(/پس.?فردا/,' ')}else if(/فردا/.test(s)){d=addD(TD(),1);s=s.replace('فردا',' ')}else if(/امروز/.test(s)){d=TD();s=s.replace('امروز',' ')}
 return{title:s.replace(/\s+/g,' ').trim(),d,t}}
function form(){const t=S.tasks.find(x=>x.id===U.edit)||{title:'',date:TD(),time:'',pri:0,cat:'کار',rep:'n',rem:0};
 const o=(a,v,k)=>a.map((x,i)=>{const val=k?x:i;return `<option value="${val}"${val===v?' selected':''}>${x}</option>`}).join('');
 $('fb').innerHTML=U.form?`<div class="scrim"><div class="card sheet"><div class="grab"></div><input id="f-t" value="${esc(t.title)}" placeholder="مثلاً: فردا ۱۸:۳۰ جلسه با تیم" style="width:100%;flex:none">
 <div class="row" style="margin-top:8px"><input type="date" id="f-d" value="${t.date}"><input type="time" id="f-h" value="${t.time}"></div>
 <div class="row" style="margin-top:8px"><select id="f-p">${o(PRI,t.pri)}</select><select id="f-c">${o(Object.keys(CATS),t.cat,1)}</select></div>
 <div class="row" style="margin-top:8px"><select id="f-r"><option value="n"${t.rep==='n'?' selected':''}>تکرار نشود</option><option value="d"${t.rep==='d'?' selected':''}>هر روز</option><option value="w"${t.rep==='w'?' selected':''}>هر هفته</option></select>
 <select id="f-m">${[0,5,15,60].map(m=>`<option value="${m}"${t.rem===m?' selected':''}>${m?'یادآور '+fs(m)+' دقیقه قبل':'یادآور سر وقت'}</option>`).join('')}</select></div>
 <div class="row" style="margin-top:8px"><select id="f-u">${[0,15,30,45,60,90,120].map(m=>`<option value="${m}"${(t.dur||0)===m?' selected':''}>${m?'⏳ مدت: '+fm(m):'⏳ مدت: تعیین نشده'}</option>`).join('')}</select></div>
 <div class="row" style="margin-top:10px"><button id="f-ok">${U.edit?'ذخیره':'افزودن'}</button><button class="s" id="f-x">انصراف</button>${U.edit?'<button class="s" id="f-del" style="color:var(--bad)">حذف</button>':''}</div>
 <div class="note">نکته: می‌تونی تاریخ و ساعت رو داخل عنوان بنویسی؛ مثلاً «فردا ۱۸:۳۰ زنگ به مامان».</div></div></div>`:''}
function submit(){let title=$('f-t').value.trim();if(!title)return;let date=$('f-d').value||TD(),time=$('f-h').value;
 const q=quick(title);if(q.title&&(q.d||q.t)){title=q.title;if(q.d&&date===TD())date=q.d;if(q.t&&!time)time=q.t}
 const v={title,date,time,pri:+$('f-p').value,cat:$('f-c').value,rep:$('f-r').value,rem:+$('f-m').value,dur:+$('f-u').value};
 if(U.edit){const t=S.tasks.find(x=>x.id===U.edit);Object.assign(t,v);setAt(t)}else{const t=Object.assign({id:uid(),done:false},v);setAt(t);S.tasks.push(t)}
 U.form=false;U.edit=null;save();form();render();tick()}
function toggle(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;
 if(t.done){t.doneAt=TD();if(t.rep!=='n'&&!t.child){const b=t.date<TD()?TD():t.date,c=Object.assign({},t,{id:uid(),date:addD(b,t.rep==='d'?1:7),done:false,doneAt:null,child:null});setAt(c);t.child=c.id;S.tasks.push(c)}}
 else{t.doneAt=null;if(t.child){const c=S.tasks.find(x=>x.id===t.child);if(c&&!c.done)S.tasks=S.tasks.filter(x=>x!==c);t.child=null}}
 save();render()}
function item(t){const od=!t.done&&t.date<TD();
 return `<div class="t${t.done?' d':''}"><i class="pb" style="background:${PC[t.pri]}"></i><input type="checkbox" data-id="${t.id}"${t.done?' checked':''}${od?' disabled':''}><div class="n"><b>${esc(t.title)}</b><small><span style="color:${CATS[t.cat]||'#888'}">● ${t.cat}</span> · ${fd(t.date)}${t.time?' · '+fs(t.time):''}${t.dur?' · ⏳ '+fm(t.dur):''}${t.rep!=='n'?' · 🔁':''}${od?' · <u class="od">از دست رفته (۱−)</u>':''}</small></div><button class="g" data-edit="${t.id}">✎</button><button class="g" data-del="${t.id}">✕</button></div>`}
const score=()=>S.tasks.filter(t=>t.done).length-S.tasks.filter(t=>!t.done&&t.date<TD()).length;
const flt=()=>S.tasks.filter(t=>(!U.cat||t.cat===U.cat)&&(!U.q||t.title.includes(U.q)));
const srt=(a,b)=>a.done-b.done||(a.date+(a.time||'99'))<(b.date+(b.time||'99'))?-1:1;
const lst=(a,m)=>a.length?a.map(item).join(''):`<div class="empty">${m}</div>`;
function ring(p){const r=34,c=2*Math.PI*r;return `<svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--bar)" stroke-width="9"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--ok)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="15" font-weight="700" fill="var(--tx)">${fs(Math.round(p*100))}٪</text></svg>`}
function days(n){const a=[];for(let i=n-1;i>=0;i--)a.push(addD(TD(),-i));return a}
function bars(ds){const W=300,H=120,n=ds.length,bw=n>10?7:26,g=(W-bw*n)/(n-1);
 const rows=ds.map(k=>{const ts=S.tasks.filter(t=>t.date===k);return{k,t:ts.length,d:ts.filter(t=>t.done).length}});
 const mx=Math.max(1,...rows.map(r=>r.t));let s=`<svg viewBox="0 0 ${W} ${H+22}" width="100%" role="img" aria-label="نمودار پیشرفت">`;
 rows.forEach((r,j)=>{const x=W-bw-j*(bw+g),h=r.t/mx*H,e=r.d/mx*H;
  s+=`<rect x="${x}" y="${H-h}" width="${bw}" height="${h}" rx="3" fill="var(--bar)"/><rect x="${x}" y="${H-e}" width="${bw}" height="${e}" rx="3" fill="var(--ok)"/>`;
  if(n<=7){if(r.t)s+=`<text x="${x+bw/2}" y="${H-h-4}" font-size="10" text-anchor="middle" fill="var(--mut)">${fs(r.d+'/'+r.t)}</text>`;let l=r.k.slice(8);try{l=new Date(r.k+'T12:00:00').toLocaleDateString('fa-IR',{weekday:'short'})}catch(e){}s+=`<text x="${x+bw/2}" y="${H+15}" font-size="10" text-anchor="middle" fill="var(--mut)">${l}</text>`}});
 return {svg:s+'</svg>',rows}}
