<style>

<body>
<div class="top"><h1>📋 پلنر من</h1><div class="row"><button class="s" id="fo"></button><button class="s" id="gs"></button><button id="th" style="display:none"></button></div></div>
<button id="plus" aria-label="کار جدید">＋</button>
<div id="fb"></div>
<input id="q" placeholder="🔍 جستجو در کارها…" style="width:100%;flex:none">
<div class="chips" id="chips"></div>
<div id="view"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const KEY='planner-v2';
let S={tasks:[],theme:''},U={tab:'today',cat:'',q:'',rng:7,form:false,edit:null,tm:null};
const CATS={'کار':'#4f6df5','شخصی':'#e0709a','مطالعه':'#e0a030','سلامت':'#22a06b','خرید':'#8a5cf5','سایر':'#7a8095'};
const PRI=['کم','متوسط','زیاد'],PC=['#7a8095','#e0a030','#e5484d'];
const z=n=>String(n).padStart(2,'0'),$=i=>document.getElementById(i);
const ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const TD=()=>ymd(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const fs=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const fm=m=>m<60?fs(m)+' دقیقه':fs(Math.floor(m/60))+' ساعت'+(m%60?' و '+fs(m%60)+' دقیقه':'');
const fd=s=>{try{return new Date(s+'T12:00:00').toLocaleDateString('fa-IR',{weekday:'short',month:'long',day:'numeric'})}catch(e){return s}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function setAt(t){t.at=t.time?new Date(t.date+'T'+t.time).getTime()-(t.rem||0)*60000:0;t.fired=false}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('planner-v1'));if(Array.isArray(o))S.tasks=o;else if(o&&o.tasks)S=Object.assign(S,o)}catch(e){}
 S.tasks.forEach(t=>{t.pri=t.pri||0;t.cat=t.cat||'سایر';t.rep=t.rep||'n';t.rem=t.rem||0;if(t.at===undefined){const n=t.notified;setAt(t);t.fired=!!n}});theme()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function theme(){const r=document.documentElement;S.theme?r.setAttribute('data-theme',S.theme):r.removeAttribute('data-theme')}
function quick(s){s=s.replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));let d=null,t='';
 const m=s.match(/(\d{1,2})[:٫](\d{2})/);if(m&&+m[1]<24&&+m[2]<60){t=z(+m[1])+':'+m[2];s=s.replace(m[0],' ')}
 if(/پس.?فردا/.test(s)){d=addD(TD(),2);s=s.replace(/پس.?فردا/,' ')}else if(/فردا/.test(s)){d=addD(TD(),1);s=s.replace('فردا',' ')}else if(/امروز/.test(s)){d=TD();s=s.replace('امروز',' ')}
 return{title:s.replace(/\s+/g,' ').trim(),d,t}}
function form(){const t=S.tasks.find(x=>x.id===U.edit)||{title:'',date:TD(),time:'',pri:0,cat:'کار',rep:'n',rem:0};
 const o=(a,v,k)=>a.map((x,i)=>{const val=k?x:i;return `<option value="${val}"${val===v?' selected':''}>${x}</option>`}).join('');
 $('fb').innerHTML=U.form?`<div class="scrim"><div class="card sheet"><div class="grab"></div><input id="f-t" value="${esc(t.title)}" placeholder="مثلاً: فردا ۱۸:۳۰ جلسه با تیم" style="width:100%;flex:none">
 <div class="row" style="margin-top:8px"><input type="date" id="f-d" value="${t.date}"><input type="time" id="f-h" value="${t.time}"></div>
 <div class="row" style="margin-top:8px"><select id="f-p">${o(PRI,t.pri)}</select><select id="f-c">${o(Object.keys(CATS),t.cat,1)}</select></div>
 <div class="row" style="margin-top:8px"><select id="f-r"><option value="n"${t.rep==='n'?' selected':''}>تکرار نشود</option><option value="d"${t.rep==='d'?' selected':''}>هر روز</option><option value="w"${t.rep==='w'?' selected':''}>هر هفته</option></select>
 <select id="f-m">${[0,5,15,60].map(m=>`<option value="${m}"${t.rem===m?' selected':''}>${m?'یادآور '+fs(m)+' دقیقه قبل':'یادآور سر وقت'}</option>`).join('')}</select></div>
 <div class="row" style="margin-top:8px"><select id="f-u">${[0,15,30,45,60,90,120].map(m=>`<option value="${m}"${(t.dur||0)===m?' selected':''}>${m?'⏳ مدت: '+fm(m):'⏳ مدت: تعیین نشده'}</option>`).join('')}</select></div>
 <div class="row" style="margin-top:10px"><button id="f-ok">${U.edit?'ذخیره':'افزودن'}</button><button class="s" id="f-x">انصراف</button>${U.edit?'<button class="s" id="f-del" style="color:var(--bad)">حذف</button>':''}</div>

const _st=stats;stats=function(){const f=S.fl||{},td=TD();let w=0;for(let i=0;i<7;i++)w+=f[addD(td,-i)]||0;return `<div class='card'><b>تمرکز</b><div class='kp' style='margin-top:8px'><div><b>${fm(f[td]||0)}</b><span>امروز</span></div><div><b>${fm(w)}</b><span>۷ روز اخیر</span></div><div><b>${fs(Object.keys(f).length)}</b><span>روز تمرکز</span></div></div></div>`+_st()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-focus]');if(b)openFocus(b.dataset.focus)});
$('fo').innerHTML=ic('timer',22);$('fo').setAttribute('data-tip','تمرکز');$('fo').dataset.ok='fo';$('fo').onclick=()=>openFocus();
$('gs').innerHTML=ic('gear',22);$('gs').setAttribute('data-tip','تنظیمات');$('gs').dataset.ok='gs';$('gs').onclick=openSettings;
const _tg=toggle;toggle=function(id){const t=S.tasks.find(x=>x.id===id),was=t&&t.done;_tg(id);if(t&&!was&&t.done&&!window.NOASK)afterDone(t)};
let AK=null,AKW=[];
function afterDone(t){if(t.spent&&!t.act){t.act=t.spent;save()}if(t.dur>0&&!t.act)askAct(t.id);else askWhy(t.id)}
function askAct(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;AK=id;const o=[...new Set([5,10,15,20,30,45,60,90,120,t.dur])].sort((a,b)=>a-b);
 pkb.innerHTML=`<div class='card sheet'><div class='grab'></div><h3 class='st'>واقعاً چقدر طول کشید؟</h3><div class='note' style='text-align:center'>«${esc(t.title)}» · تخمین تو: ${fm(t.dur)}</div><div class='mcs' style='flex-wrap:wrap;overflow:visible;justify-content:center'>${o.map(m=>`<button class='mc${m===t.dur?' on':''}' data-act='${m}'>${fm(m)}</button>`).join('')}</div><div class='row' style='justify-content:center'><button class='s' data-act='0'>رد کردن</button></div></div>`;pkb.style.display='flex'}
function askWhy(id){const t=S.tasks.find(x=>x.id===id);if(!t||!t.act||!(t.dur>0)||t.why!==undefined){AK=null;return}const d=(t.act-t.dur)/t.dur;if(Math.abs(d)<=.25){AK=null;return}
 AK=id;AKW=d<0?['کار ساده‌تر از انتظارم بود','تمرکز بالا داشتم','قبلاً مشابهش رو انجام داده بودم','بخشی از کار رو حذف کردم','بد تخمین زدم (بیش از حد)']:['کار پیچیده‌تر بود','حواس‌پرتی و وقفه','کم‌انرژی بودم','چیزی رو نمی‌دونستم و باید یاد می‌گرفتم','بد تخمین زدم (کم از حد)'];
 pkb.innerHTML=`<div class='card sheet'><div class='grab'></div><h3 class='st'>چرا ${d<0?'زودتر':'دیرتر'} از تخمین تموم شد؟</h3><div class='note' style='text-align:center'>تخمین ${fm(t.dur)} · واقعی ${fm(t.act)} (${fs(Math.round(Math.abs(d)*100))}٪ ${d<0?'کمتر':'بیشتر'})</div>${AKW.map((w,i)=>`<button class='s' style='width:100%;text-align:start;margin-top:6px' data-wi='${i}'>${w}</button>`).join('')}<div class='row' style='justify-content:center;margin-top:10px'><button class='s' data-wi='x'>رد کردن</button></div></div>`;pkb.style.display='flex'}
pkb.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-wi]');if(!b||!AK)return;const id=AK,t=S.tasks.find(x=>x.id===id);
 if(b.dataset.act!==undefined){const m=+b.dataset.act;if(t&&m>0){t.act=m;save()}pclose();if(t&&m>0)askWhy(id);else{if(t){t.why='';save()}AK=null}}
 else{if(t){t.why=b.dataset.wi==='x'?'':AKW[+b.dataset.wi];save()}pclose();AK=null}});
function estCard(){const ts=S.tasks.filter(t=>t.done&&t.dur>0&&t.act>0);
 if(!ts.length)return `<div class='card'><b>دقت تخمین زمان</b><div class='note' style='margin-top:6px;line-height:1.9'>برای کارهایی که «مدت‌زمان» داری و تیک می‌زنی، ازت می‌پرسم واقعاً چقدر طول کشید. بعد از چند کار، اینجا می‌بینی چقدر درست تخمین می‌زنی و چرا فرق داره. تایمر تمرکز هم زمان واقعی رو خودکار ثبت می‌کنه.</div></div>`;
 const E=ts.reduce((a,t)=>a+t.dur,0),A=ts.reduce((a,t)=>a+t.act,0),r=A/E,p=Math.round((r-1)*100);
 const msg=Math.abs(p)<=10?'تخمین زمانت تقریباً دقیقه.':p>0?`معمولاً ${fs(p)}٪ بیشتر از تخمینت طول می‌کشه. قانون ساده: هر تخمین رو ×${fs(Math.round(r*10)/10)} کن.`:`معمولاً ${fs(-p)}٪ زودتر از تخمینت تموم می‌شه؛ می‌تونی تخمینت رو کمتر بگیری و کار بیشتری تو روز جا بدی.`;
 const rows=ts.slice().sort((a,b)=>b.date<a.date?-1:1).slice(0,8),mx=Math.max(...rows.map(t=>Math.max(t.dur,t.act)));
 const bc={};ts.forEach(t=>{const x=bc[t.cat]=bc[t.cat]||{e:0,a:0};x.e+=t.dur;x.a+=t.act});
 const cats=Object.keys(bc).map(c=>{const q=Math.round((bc[c].a/bc[c].e-1)*100);return `<div class='row' style='justify-content:space-between'><span>${c}</span><span class='note'>${Math.abs(q)<=5?'دقیق':fs(Math.abs(q))+'٪ '+(q>0?'بیشتر از تخمین':'کمتر از تخمین')}</span></div>`}).join('');
 const rc={};ts.forEach(t=>{if(t.why)rc[t.why]=(rc[t.why]||0)+1});const top=Object.entries(rc).sort((a,b)=>b[1]-a[1]).slice(0,3);
 return `<div class='card'><b>دقت تخمین زمان</b><div class='note' style='margin:6px 0 10px;line-height:1.9'>${msg}<br>جمع تخمین: ${fm(E)} · جمع واقعی: ${fm(A)}</div>${cats}${top.length?`<div class='note' style='margin:10px 0 4px'>دلیل‌های پرتکرار فرق:</div>${top.map(x=>`<div class='note'>${fs(x[1])} بار: ${esc(x[0])}</div>`).join('')}`:''}<div class='note' style='margin:12px 0 0'>هشت کار آخر (خاکستری: تخمین، سبز یا قرمز: واقعی)</div>${rows.map(t=>`<div style='margin:10px 0 0'><div class='row' style='justify-content:space-between;flex-wrap:nowrap'><span>${esc(t.title)}</span><span class='note'>${fm(t.dur)} ← ${fm(t.act)}</span></div><div class='hb' style='margin:4px 0'><i style='width:${t.dur/mx*100}%;background:var(--mut)'></i></div><div class='hb' style='margin:0 0 4px'><i style='width:${t.act/mx*100}%;background:${t.act>t.dur?'var(--bad)':'var(--ok)'}'></i></div>${t.why?`<div class='note'>${esc(t.why)}</div>`:''}</div>`).join('')}</div>`}
function wkAgg(a,b){const ds=[];for(let i=a;i<b;i++)ds.push(addD(TD(),-i));const ts=S.tasks.filter(t=>ds.includes(t.date));return{t:ts.length,d:ts.filter(t=>t.done).length}}
function weekCard(){const a=wkAgg(0,7),b=wkAgg(7,14),ra=a.t?Math.round(a.d/a.t*100):0,rb=b.t?Math.round(b.d/b.t*100):0;
 const cnt=Array(7).fill(0);for(let i=0;i<28;i++){const iso=addD(TD(),-i);cnt[dow(iso)]+=S.tasks.filter(t=>t.date===iso&&t.done).length}
 const mxc=Math.max(...cnt),bi=cnt.indexOf(mxc),hs=S.habits||[],hl=S.hl||{};let hd=0,ht=0;
 for(let i=0;i<7;i++){const iso=addD(TD(),-i);hs.forEach(h=>{if(h.days.includes(dow(iso))){ht++;if((hl[h.id]||{})[iso])hd++}})}
 return `<div class='card'><b>مرور این هفته</b><div class='note' style='margin-top:6px;line-height:2'>کارها: ${fs(a.d)} از ${fs(a.t)} (${fs(ra)}٪)${b.t?' · هفته‌ی قبل '+fs(rb)+'٪'+(ra>rb?' (بهتر شدی)':ra<rb?' (کمتر شد)':''):''}<br>${mxc>0?'بهترین روز تو: '+WD[bi]+'<br>':''}${ht?'عادت‌ها: '+fs(hd)+' از '+fs(ht)+' ('+fs(Math.round(hd/ht*100))+'٪)':'هنوز عادتی ثبت نکردی.'}</div></div>`}
const _st2=stats;stats=function(){return weekCard()+estCard()+_st2()};
const hAll=()=>S.habits||[],hDone=(h,iso)=>!!((S.hl||{})[h.id]||{})[iso],hDue=(h,iso)=>h.days.includes(dow(iso));
function hStreak(h){let s=0;for(let i=0;i<400;i++){const iso=addD(TD(),-i);if(!hDue(h,iso))continue;if(hDone(h,iso))s++;else if(i===0)continue;else break}return s}
function hBest(h){let b=0,r=0;for(let i=400;i>=0;i--){const iso=addD(TD(),-i);if(!hDue(h,iso))continue;if(hDone(h,iso)){r++;b=Math.max(b,r)}else if(i!==0)r=0}return b}
function habitsView(){const td=TD(),hs=hAll(),due=hs.filter(h=>hDue(h,td)),dn=due.filter(h=>hDone(h,td)).length;
 let h=`<div class='card row' style='gap:14px'>${ring(due.length?dn/due.length:0)}<div><b>${due.length?fs(dn)+' از '+fs(due.length)+' عادت امروز':'امروز عادتی نداری'}</b><div class='note'>هر روز تیک بزن تا رکورد پیاپی ساخته بشه. روی نقطه‌ی روزهای قبل بزن تا اصلاحش کنی.</div></div></div>`;
 h+=hs.length?hs.map(x=>{const dueT=hDue(x,td),dd=hDone(x,td);let dots='',d30=0,n30=0;
  for(let i=6;i>=0;i--){const iso=addD(td,-i);dots+=`<button class='hdot${hDone(x,iso)?' on':''}${hDue(x,iso)?'':' off'}' data-hd='${x.id}|${iso}' aria-label='${jfmt(iso)}'></button>`}
  for(let i=0;i<30;i++){const iso=addD(td,-i);if(hDue(x,iso)){d30++;if(hDone(x,iso))n30++}}
  return `<div class='card'><div class='row' style='flex-wrap:nowrap;justify-content:space-between'><div class='row' style='flex-wrap:nowrap'><button class='hck${dd?' on':''}' data-hk='${x.id}'${dueT?'':' disabled'}>${ic('check',22)}</button><div><b>${esc(x.name)}</b><div class='note'>${dueT?'':'امروز نیست · '}رکورد پیاپی ${fs(hStreak(x))} روز · بهترین ${fs(hBest(x))}</div></div></div><button class='g' data-he='${x.id}'>${ic('gear',18)}</button></div><div class='row' style='margin-top:12px;flex-wrap:nowrap;justify-content:space-between'><div class='row' style='gap:6px;flex-wrap:nowrap'>${dots}</div><span class='note'>${d30?fs(Math.round(n30/d30*100))+'٪ در ۳۰ روز':''}</span></div></div>`}).join(''):`<div class='card'><div class='empty'>هنوز عادتی نساختی. اولین عادتت رو بساز: مثلاً مطالعه، ورزش، آب خوردن.</div></div>`;
 return h+`<div style='text-align:center;margin-top:6px'><button data-hnew='1'>عادت جدید</button></div>`}
let HE=null;
function openHabit(id){const h=hAll().find(x=>x.id===id);HE=h?{id:h.id,name:h.name,days:[...h.days]}:{id:'',name:'',days:[0,1,2,3,4,5,6]};drawHabit()}
function drawHabit(){pkb.innerHTML=`<div class='card sheet'><div class='grab'></div><h3 class='st'>${HE.id?'ویرایش عادت':'عادت جدید'}</h3><div class='fld'><label class='fl'>اسم عادت</label><input id='h-n' value='${esc(HE.name)}' placeholder='مثلاً: ۲۰ دقیقه مطالعه'></div><div class='fl' style='margin:12px 0 6px'>روزهای هفته</div><div class='mcs' style='flex-wrap:wrap;overflow:visible'>${WD.map((w,i)=>`<button class='mc${HE.days.includes(i)?' on':''}' data-hday='${i}'>${w}</button>`).join('')}</div><div class='row' style='margin-top:12px'><button data-hsave='1'>ذخیره</button><button class='s' data-close='1'>انصراف</button>${HE.id?`<button class='s' style='color:var(--bad)' data-hdel='1'>حذف</button>`:''}</div></div>`;pkb.style.display='flex'}
pkb.addEventListener('click',e=>{if(!HE)return;const b=e.target.closest('button');if(!b)return;const n=$('h-n');if(n)HE.name=n.value.trim();
 if(b.dataset.hday!==undefined){const i=+b.dataset.hday,k=HE.days.indexOf(i);if(k<0)HE.days.push(i);else HE.days.splice(k,1);drawHabit()}
 else if(b.dataset.hsave){if(!HE.name||!HE.days.length)return;S.habits=S.habits||[];if(HE.id){const h=S.habits.find(x=>x.id===HE.id);if(h){h.name=HE.name;h.days=HE.days}}else S.habits.push({id:uid(),name:HE.name,days:HE.days});HE=null;save();pclose();render()}
 else if(b.dataset.hdel){if(confirm('این عادت حذف شود؟')){S.habits=hAll().filter(x=>x.id!==HE.id);HE=null;save();pclose();render()}}
 else if(b.dataset.close)HE=null});
$('view').addEventListener('click',e=>{const k=e.target.closest('[data-hk],[data-hd],[data-he],[data-hnew]');if(!k)return;
 const tg=(id,iso)=>{S.hl=S.hl||{};const m=S.hl[id]=S.hl[id]||{};if(m[iso])delete m[iso];else m[iso]=1;save();render()};
 if(k.dataset.hk)tg(k.dataset.hk,TD());else if(k.dataset.hd){const q=k.dataset.hd.split('|');tg(q[0],q[1])}else if(k.dataset.he)openHabit(k.dataset.he);else openHabit('')});
const _r3=render;render=function(){_r3();if(U.tab==='habits'){$('chips').style.display='none';$('q').style.display='none';$('view').innerHTML=habitsView()}};
const p2l=s=>String(s).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/\D/g,'');
function openTime(){const v=$('f-h').value,n=new Date();const h=v?+v.slice(0,2):n.getHours(),m=v?+v.slice(3,5):n.getMinutes();
 const col=(id,arr)=>`<div class='wh'><div class='wb'></div><div class='ws' id='${id}'>${arr.map(x=>`<div class='wi'>${x}</div>`).join('')}</div></div>`;
 const hs=[...Array(24)].map((_,i)=>fs(i+1)),ms=[...Array(60)].map((_,i)=>fs(z(i)));
 pkb.innerHTML=`<div class='card sheet'><div class='grab'></div><h3 class='st'>تنظیم ساعت</h3><div class='row' style='justify-content:center;flex-wrap:nowrap;direction:ltr;gap:6px;margin-bottom:6px'><input class='ti' id='ti-h' inputmode='numeric' maxlength='2' autocomplete='off'><b style='font-size:30px'>:</b><input class='ti' id='ti-m' inputmode='numeric' maxlength='2' autocomplete='off'></div><div class='row' style='flex-wrap:nowrap;direction:ltr'>${col('wsH',hs)}${col('wsM',ms)}</div><div class='row' style='margin-top:12px'><button type='button' data-tok='1'>تایید</button><button type='button' class='s' data-tclr='1'>بدون ساعت</button><button type='button' class='s' data-close='1'>بستن</button></div></div>`;
 pkb.style.display='flex';
 const H=$('wsH'),M=$('wsM'),ih=$('ti-h'),im=$('ti-m');
 const fill=()=>{if(document.activeElement!==ih)ih.value=fs(rd(H)+1);if(document.activeElement!==im)im.value=fs(z(rd(M)))};
 H.scrollTop=((h===0?24:h)-1)*36;M.scrollTop=m*36;
 [H,M].forEach(w=>{w.addEventListener('scroll',()=>{mark(w);fill()});mark(w);w.onclick=ev=>{const it=ev.target.closest('.wi');if(it)w.scrollTo({top:[...w.children].indexOf(it)*36,behavior:'smooth'})}});
 fill();
 ih.addEventListener('input',()=>{const s=p2l(ih.value).slice(0,2);ih.value=fs(s);if(s==='')return;let x=+s;if(x===0||x>24)x=24;H.scrollTop=(x-1)*36});
 im.addEventListener('input',()=>{const s=p2l(im.value).slice(0,2);im.value=fs(s);if(s==='')return;M.scrollTop=Math.min(59,+s)*36});
 [ih,im].forEach(i=>{i.addEventListener('focus',()=>i.select());i.addEventListener('blur',fill);i.addEventListener('keydown',ev=>{if(ev.key==='Enter')i.blur()})})}
load();applyAcc();render();form();tick();setInterval(tick,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
</script>
